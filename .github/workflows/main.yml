name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '*'

jobs:
  build-wrapper:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          architecture: ${{ runner.os == 'macOS' && 'arm64' || 'x64' }}

      - name: Compile wrapper on Windows
        if: startsWith(runner.os, 'Windows')
        run: |
          mkdir tmp-build
          cd tmp-build
          cmake $Env:github_workspace/pythonfmu3/pythonfmu-export -DCMAKE_BUILD_TYPE=Release -A x64
          cmake --build . --config Release
          cd ..

      - name: Compile wrapper on Linux
        if: runner.os == 'Linux'
        run: |
          docker build -f DockerFile -t pythonfmu3-wrapper --target build .
      
      - name: Compile wrapper on macOS (Apple Silicon and Intel)
        if: runner.os == 'macOS'
        run: |
          # One runner builds both architectures: arm64 natively, x86_64 by cross-compiling.
          # CMake puts each in its FMI platform folder (aarch64-darwin, x86_64-darwin).
          for arch in arm64 x86_64; do
            cmake -S pythonfmu3/pythonfmu-export -B build-$arch -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_ARCHITECTURES=$arch -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
            cmake --build build-$arch --config Release
          done
          for platform in aarch64-darwin x86_64-darwin; do
            for lib in libpythonfmu-export.dylib libpythonfmu-backend.dylib; do
              test -f pythonfmu3/resources/binaries/$platform/$lib || { echo "missing $platform/$lib"; exit 1; }
            done
          done
          lipo -archs pythonfmu3/resources/binaries/aarch64-darwin/libpythonfmu-export.dylib
          lipo -archs pythonfmu3/resources/binaries/x86_64-darwin/libpythonfmu-export.dylib

      - name: Create container and copy out artifact
        if: runner.os == 'Linux'
        run: |
          docker create --name extract pythonfmu3-wrapper
          docker cp extract:/io/pythonfmu3/resources $GITHUB_WORKSPACE/pythonfmu3
          docker rm extract

      - name: Archive wrapper library
        uses: actions/upload-artifact@v4
        with:
          name: lib-wrapper-${{ matrix.os }}
          path: pythonfmu3/resources

  build-python:
    needs: build-wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          architecture: 'x64'

      - name: Download wrappers
        uses: actions/download-artifact@v4
        with:
          pattern: lib-wrapper-*
          path: pythonfmu3/resources
          merge-multiple: true
    
      - name: Build distribution artifacts
        run: |
          python -m pip install build
          python -m build

      - name: Check the wheel has every platform's binaries
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          expected = ["x86_64-linux", "x86_64-windows", "aarch64-darwin", "x86_64-darwin"]
          missing = [p for p in expected if not any(n.startswith(f"pythonfmu3/resources/binaries/{p}/") for n in names)]
          print(wheel, "missing:", missing or "none")
          raise SystemExit(1 if missing else 0)
          PY

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel
          path: dist

  test:
    needs: build-python
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
        exclude:
          - os: macos-15          # setup-python has no arm64 build of Python 3.9
            python-version: '3.9'
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ runner.os == 'macOS' && 'arm64' || 'x64' }}

      - name: Download python package
        uses: actions/download-artifact@v4
        with:
          name: python-wheel

      - name: Run the Tests
        run: |
          pip install -r requirements.txt
          cd python-wheel
          pip install pythonfmu3*.whl
          pip install fmpy
          pytest --pyargs pythonfmu3
          cd ..
        shell: bash -l {0}
