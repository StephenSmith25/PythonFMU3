name: Upload Python Package

on:
  release:
    types: [published]


jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
    
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          architecture: ${{ runner.os == 'macOS' && 'arm64' || 'x64' }}
      - name: Compile wrapper on Windows
        if: startsWith(runner.os, 'Windows')
        run: |
          mkdir tmp-build
          cd tmp-build
          cmake $Env:github_workspace/pythonfmu3/pythonfmu-export -DCMAKE_BUILD_TYPE=Release -A x64
          cmake --build . --config Release
          cd ..
      - name: Compile wrapper on Linux
        if: runner.os == 'Linux'
        run: |
          docker build -f DockerFile -t pythonfmu3-wrapper --target build .
      
      - name: Compile wrapper on macOS (Apple Silicon and Intel)
        if: runner.os == 'macOS'
        run: |
          # One runner builds both architectures: arm64 natively, x86_64 by cross-compiling.
          # CMake puts each in its FMI platform folder (aarch64-darwin, x86_64-darwin).
          for arch in arm64 x86_64; do
            cmake -S pythonfmu3/pythonfmu-export -B build-$arch -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_ARCHITECTURES=$arch -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
            cmake --build build-$arch --config Release
          done
          for platform in aarch64-darwin x86_64-darwin; do
            for lib in libpythonfmu-export.dylib libpythonfmu-backend.dylib; do
              test -f pythonfmu3/resources/binaries/$platform/$lib || { echo "missing $platform/$lib"; exit 1; }
            done
          done
          lipo -archs pythonfmu3/resources/binaries/aarch64-darwin/libpythonfmu-export.dylib
          lipo -archs pythonfmu3/resources/binaries/x86_64-darwin/libpythonfmu-export.dylib

      - name: Create container and copy out artifact
        if: runner.os == 'Linux'
        run: |
          docker create --name extract pythonfmu3-wrapper
          docker cp extract:/io/pythonfmu3/resources $GITHUB_WORKSPACE/pythonfmu3
          docker rm extract
      - name: Archive wrapper library
        uses: actions/upload-artifact@v4
        with:
          name: lib-wrapper-${{ matrix.os }}
          path: pythonfmu3/resources

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Download wrappers
      uses: actions/download-artifact@v4
      with:
        pattern: lib-wrapper-*
        path: pythonfmu3/resources        
        merge-multiple: true
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    - name: Build and publish
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_PYTHONFMU_API_TOKEN }}
      run: |
        python -m build
        twine upload dist/*
